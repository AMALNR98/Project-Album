{% extends 'base.html' %}

{% block content %}
    <div class="content-stack">
        <div class="page-hero">
            <div>
                <p class="eyebrow">Upload</p>
                <h1 class="page-title">Add a photo</h1>
                <p class="page-subtitle">A cleaner upload flow with the same Flask endpoint and form payload.</p>
            </div>
        </div>

        <form method="post" enctype="multipart/form-data" class="app-panel content-stack">
            <div class="field-group">
                <label class="field-label" for="photo-description-inline">Description</label>
                <input id="photo-description-inline" type="text" name="description" class="form-control" placeholder="Description">
            </div>
            <div class="field-group">
                <label class="field-label" for="photo-file-inline">Image file</label>
                <input id="photo-file-inline" type="file" name="photo" class="form-control">
            </div>
            <div class="inline-actions">
                <input type="submit" value="Submit" class="btn btn-primary">
            </div>
        </form>
    </div>
{% endblock %}
