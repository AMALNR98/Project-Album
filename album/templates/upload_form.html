{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash-stack mb-3">
            {% for message in messages %}
                <div class="flash-card" role="status">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<form method="POST" enctype="multipart/form-data" action="{{ url_for('album.add_photo', user_id=1, album_name='cooking') }}" class="app-panel content-stack">
    <div class="field-group">
        <label class="field-label" for="upload-form-title">Title</label>
        <input id="upload-form-title" type="text" name="name" class="form-control" placeholder="Title">
    </div>
    <div class="field-group">
        <label class="field-label" for="upload-form-file">Image file</label>
        <input id="upload-form-file" type="file" name="photo" class="form-control">
    </div>
    <div class="inline-actions">
        <input type="submit" value="Submit" class="btn btn-primary">
    </div>
</form>
