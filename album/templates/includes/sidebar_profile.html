<section class="profile-panel">
    <div class="profile-panel__cover"></div>
    <img
        src="{{ current_user | photo }}"
        class="profile-panel__avatar"
        alt="{{ current_user.fname }} {{ current_user.lname }}"
    />
    <h2 class="profile-panel__name">{{ current_user.fname + " " + current_user.lname }}</h2>
    <p class="profile-panel__bio">{{ current_user.bio if current_user.bio else 'Shape a profile that feels polished, personal, and easy to discover.' }}</p>
    <div class="profile-panel__meta">
        <span class="meta-chip"><i class="fa-regular fa-user"></i> Personal gallery</span>
        <span class="meta-chip"><i class="fa-regular fa-compass"></i> Settings and sharing from one place</span>
    </div>
</section>
