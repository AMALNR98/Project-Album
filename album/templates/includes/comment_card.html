<article class="comment-card">
    <div class="d-flex flex-start gap-3">
        <img
            class="rounded-circle comment-avatar"
            src="{{ comment.user_id | photo }}"
            alt="{{ comment.display_name }}"
        />
        <div class="w-100">
            <div class="comment-card__header">
                <div>
                    <h3 class="media-card__title mb-1">{{ comment.display_name }}</h3>
                    <p class="comment-card__body mb-0">{{ comment.comment }}</p>
                </div>
                <p class="media-card__meta mb-0">{{ comment.created_date | fromnow }}</p>
            </div>
            <div class="comment-card__footer mt-3">
                <p class="media-card__meta mb-0">Shared with the album community</p>
                <div class="d-flex flex-row gap-3 align-items-center">
                    <i class="fas fa-star text-warning"></i>
                    <i class="far fa-check-circle muted-note"></i>
                </div>
            </div>
        </div>
    </div>
</article>
